<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    主畫面圖示的母檔。圖案的唯一來源，npm run icons 讀這一份輸出四張 PNG。

    字已經轉成 <path>：「単語」是 Noto Serif JP 700、「たんご」是 Noto Sans JP 700。
    這兩套字型不在 repo 裡，留著 <text> 的話換一台電腦跑出來就是別的字型。
    要改字就得拿字型檔重新轉一次路徑（用 fontkit 把可變字型定在 wght 700，
    再照 text-anchor="middle" 的算法把字距鋪開），不是改這裡的字串。

    每個數字都是 .scratch/ios-app/issues/22-icon-redesign.md 談定的，不要順手調。
  -->
  <defs>
    <linearGradient id="base" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#333F73" />
      <stop offset="0.48" stop-color="#1B2450" />
      <stop offset="1" stop-color="#080B24" />
    </linearGradient>

    <radialGradient id="glow" cx="0.28" cy="0.08" r="0.92">
      <stop offset="0" stop-color="#9BA9DC" stop-opacity="0.46" />
      <stop offset="1" stop-color="#9BA9DC" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.62" r="0.78">
      <stop offset="0.55" stop-color="#03050F" stop-opacity="0" />
      <stop offset="1" stop-color="#03050F" stop-opacity="0.5" />
    </radialGradient>

    <linearGradient id="glass" x1="0.14" y1="0" x2="0.86" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="0.44" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="rim" x1="0.05" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.30" />
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.72" />
    </linearGradient>

    <linearGradient id="ink" x1="0.28" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.68" stop-color="#F7F9FF" />
      <stop offset="1" stop-color="#DDE5FA" />
    </linearGradient>

    <filter id="reading-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#03040F" flood-opacity="0.48" />
    </filter>

    <filter id="word-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#03040F" flood-opacity="0.62" />
    </filter>
  </defs>

  <!-- 底：漸層、左上光暈、四周暗角 -->
  <rect width="1024" height="1024" fill="url(#base)" />
  <rect width="1024" height="1024" fill="url(#glow)" />
  <rect width="1024" height="1024" fill="url(#vignette)" />

  <!-- 玻璃板。佔中央 67%，四角離邊 16.4%，iOS 的圓角遮罩切不到 -->
  <rect x="168" y="168" width="688" height="688" rx="172" fill="url(#glass)" stroke="url(#rim)" stroke-width="14" />
  <path d="M248 306 Q248 248 306 248 L452 248" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-opacity="0.62" />
  <path d="M776 718 Q776 776 718 776 L600 776" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-opacity="0.30" />


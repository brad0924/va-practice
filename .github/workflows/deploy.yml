name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 純文件的 push 不觸發部署；只要有一個檔案不在清單內就照常跑
    paths-ignore:
      - '**.md'
      - '.scratch/**'
      - 'docs/**'
      - '.claude/**'
      # iOS 版的改動不影響網頁版產物
      - 'mobile/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不中斷進行中的那一個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

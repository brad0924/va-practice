name: Build iOS and upload to TestFlight

# 簽章憑證有效期一年，到期時倒在簽章那一步是正常的——
# 要重做哪幾步見 docs/ios-signing-renewal.md（workflow 本身不用改）。
#
# 只手動觸發。每跑一次就佔用一個 TestFlight build number，
# 不該綁在 push 上。網頁版的部署完全不受這支 workflow 影響。
on:
  workflow_dispatch:

# 同時只跑一個，避免兩個 build 撞到同一個 build number
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    # public repo 的標準 macOS runner 不計費
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # build:ios 產出 base 為 / 且不含 service worker 的版本，
      # cap sync 把它複製進 ios/App/App/public
      - run: npm run sync:ios

      # `cap sync` 寫不出 Package.swift 的時候**仍然回傳 0**（在 Windows 上實測到：
      # 建不了符號連結就是這個下場）。真的發生的話 build 會一路跑完、外掛卻不在產物裡，
      # 要裝到 iPhone 上按下去才發現——一輪 TestFlight 就這樣白費。當場擋下來便宜得多。
      #
      # 連路徑一起檢查，不是只找套件名：Capacitor 8.5 在 Windows 上會把分隔符號寫成
      # 反斜線（`symlinks\Capacitor…`），那在 Swift 裡是非法的跳脫字元，檔案根本解析不了。
      # 只比對套件名的話，那份壞掉的 Package.swift 照樣過關。
      - name: 確認 Firebase 外掛真的進了 Package.swift
        run: |
          grep -q 'symlinks/CapacitorFirebaseAppCheck' ios/App/CapApp-SPM/Package.swift \
            || { echo "Package.swift 裡找不到 symlinks/CapacitorFirebaseAppCheck——cap sync 沒寫進去，或分隔符號是反斜線"; exit 1; }

      # App Store Connect API 金鑰。簽章已改成固定憑證（見下一步），
      # 這把金鑰現在只剩最後 altool 上傳那一步在用。
      - name: 寫入 App Store Connect API 金鑰
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      # 固定憑證。runner 每趟都是全新的機器、鑰匙圈是空的，以前靠
      # -allowProvisioningUpdates 讓 Xcode 自己去 Apple 後台新建一張憑證，
      # 每跑一趟就燒掉一格額度，額度滿了整支 workflow 就倒。
      # 現在改成把維護者手上那張 Apple Distribution 憑證帶進來，
      # CI 不再有權、也不再需要建立任何憑證。
      - name: 匯入簽章憑證與 provisioning profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          umask 077

          # 路徑先寫進 GITHUB_ENV 再去建鑰匙圈。這一步中途倒掉時（密碼錯、
          # profile 壞），收尾那步才拿得到路徑把已經建出來的鑰匙圈刪掉。
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          # 鑰匙圈跟著 job 一起生一起死，密碼每趟隨機，不必也不該存進 secrets
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          base64 -D <<< "$CERT_P12" > "$RUNNER_TEMP/cert.p12"
          base64 -D <<< "$PROFILE_B64" > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 預設閒置 5 分鐘就自動上鎖，build 跑不完；拉到 6 小時
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # 放進搜尋清單，codesign 與 exportArchive 才找得到這張憑證。
          # 後面接上原本的清單，不然 runner 既有的鑰匙圈會整組被踢掉。
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 少了這行，codesign 取用私鑰時會跳出授權對話框，在無人的 runner 上等於卡死
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          # 名稱、UUID、bundle id 全部從 profile 裡讀出來，一個都不寫死——
          # 重產一張 profile 這三個值都可能變，寫死就會對不上。
          # PROVISIONING_PROFILE_SPECIFIER 吃的是「名稱」，UUID 是拿來當檔名的。
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")
          # application-identifier 長成 <TeamID>.<bundle id>，砍掉第一段就是 bundle id
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "BUNDLE_ID=${APP_ID#*.}"
          } >> "$GITHUB_ENV"

          # Xcode 16 起改讀 UserData 底下那個目錄（CI 用的是 Xcode 26，已查證）。
          # 舊路徑一併放著，是因為工具鏈裡仍有東西只認舊的，多複製一份成本趨近於零。
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
          done

      # provisioning profile 與 team 必須掛在 App 這個 target 上，**不能**從 xcodebuild
      # 的指令參數傳。理由與那支腳本守著什麼，都寫在 scripts/inject-signing.mjs 的檔頭，
      # 那支有 scripts/inject-signing.test.mjs 守著（跑得進 npm test）。
      - name: 把簽章設定掛到 App target 上
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/inject-signing.mjs "$PROFILE_NAME" "$TEAM_ID"

      # TestFlight 不接受重複的 build number，用 run_number 保證遞增。
      # 直接把 CURRENT_PROJECT_VERSION 傳給 xcodebuild，不走 agvtool——
      # 這個專案沒有設 VERSIONING_SYSTEM = apple-generic，agvtool 改不動它。
      #
      # 這裡只留下那 8 個 SPM target 不會抗議的兩個：用哪張憑證、憑證在哪個鑰匙圈。
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 匯出 ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 手動簽章下 exportArchive 不會自己去挑憑證，signingStyle 與
          # provisioningProfiles 要明講，bundle id 對到哪張 profile 也要指名。
          # heredoc 不加引號，讓 $TEAM_ID／$BUNDLE_ID／$PROFILE_UUID 展開；
          # plist 內文沒有其他 $ 字元
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # 上傳後 App Store Connect 要處理幾分鐘，處理完才會出現在 TestFlight。
      # Internal Testing 不需要任何審查。
      - name: 上傳 TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # 檔名由 scheme 決定，不寫死；匯出目錄只會有一個 ipa
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "找不到匯出的 ipa"; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # 上傳失敗時至少把 ipa 留下來，可以手動用 Transporter 送
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

      # 驗收要求：臨時鑰匙圈在 job 結束時被清掉，不留在 runner 上。
      # 掛 always() 是因為前面任何一步倒掉時同樣要清。
      - name: 清掉臨時鑰匙圈與 profile
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"

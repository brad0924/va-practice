name: Build iOS and upload to TestFlight

# 只手動觸發。每跑一次就佔用一個 TestFlight build number，
# 不該綁在 push 上。網頁版的部署完全不受這支 workflow 影響。
on:
  workflow_dispatch:

# 同時只跑一個，避免兩個 build 撞到同一個 build number
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    # public repo 的標準 macOS runner 不計費
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # build:ios 產出 base 為 / 且不含 service worker 的版本，
      # cap sync 把它複製進 ios/App/App/public
      - run: npm run sync:ios

      # App Store Connect API 金鑰。xcodebuild 用它自動管理簽章憑證與
      # provisioning profile，因此不必手動匯出 .p12 與 .mobileprovision。
      - name: 寫入 App Store Connect API 金鑰
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          umask 077
          printf '%s\n' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      # TestFlight 不接受重複的 build number，用 run_number 保證遞增。
      # 直接把 CURRENT_PROJECT_VERSION 傳給 xcodebuild，不走 agvtool——
      # 這個專案沒有設 VERSIONING_SYSTEM = apple-generic，agvtool 改不動它。
      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 匯出 ipa
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # heredoc 不加引號，讓 $TEAM_ID 展開；plist 內文沒有其他 $ 字元
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # 上傳後 App Store Connect 要處理幾分鐘，處理完才會出現在 TestFlight。
      # Internal Testing 不需要任何審查。
      - name: 上傳 TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # 檔名由 scheme 決定，不寫死；匯出目錄只會有一個 ipa
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "找不到匯出的 ipa"; exit 1; }
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      # 上傳失敗時至少把 ipa 留下來，可以手動用 Transporter 送
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
